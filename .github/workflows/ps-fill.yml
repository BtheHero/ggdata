# PlayStation publishers, store ratings and descriptions, a part at a time, every 4 hours.
name: PlayStation details
on:
  schedule:
    - cron: "53 */4 * * *"
  workflow_dispatch:
concurrency:
  group: ps-files   # jobs that write the same files wait for each other (the others run alongside: each uploads only what it changed)
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SEED_PS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download the saved files
        run: aws s3 sync s3://ggdata/data data --endpoint-url "$R2" --only-show-errors --exclude "media/*" --exclude "compare/*" --exclude "xbox_games_*" --exclude "ps_games_*"
      - name: Note what was downloaded
        run: node tools/upload.js snapshot
      - name: Copy files from the site
        env:
          SOURCE_API: ${{ secrets.SOURCE_API }}
        run: node seed.js
      - name: Look up publishers, ratings and descriptions
        run: node run.js psfill
      - name: Light game list for the site's pages
        if: always()
        run: node jobs/lite.js ps
      - name: Upload the files
        if: always()
        run: node tools/upload.js push   # only the files this job changed
