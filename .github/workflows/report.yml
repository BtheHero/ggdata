# The automation report (tools/report.js): every run of the last 7 days, what it did, and the social posts network by
# network, as a password-protected site on Cloudflare Pages (report-site/; the password check is
# report-site/functions/_middleware.js). Every 6 hours, and by hand. It doesn't touch the site's data or the R2 bucket.
# Secrets: CLOUDFLARE_API_TOKEN (Account → Cloudflare Pages → Edit), CLOUDFLARE_ACCOUNT_ID, REPORT_PASSWORD.
name: Report
on:
  schedule:
    - cron: "29 */6 * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: report
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Runs already read
        uses: actions/cache/restore@v5
        with:
          path: .report-cache
          key: report-${{ github.run_id }}
          restore-keys: report-
      - name: Build the report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_CACHE: .report-cache/runs.json
        run: node tools/report.js report-site/public/data
      - name: Keep the runs read
        uses: actions/cache/save@v5
        with:
          path: .report-cache
          key: report-${{ github.run_id }}
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        working-directory: report-site
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$REPORT_PASSWORD" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and REPORT_PASSWORD secrets"; exit 1
          fi
          # secrets pasted with a space or a line break around them
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          # say which part is wrong: the token itself, or its access to Pages on this account
          CF=https://api.cloudflare.com/client/v4
          if ! curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF/user/tokens/verify" | grep -q '"status":"active"'; then
            echo "::error::CLOUDFLARE_API_TOKEN isn't a valid, active API token (an API token from My Profile → API Tokens, not the Global API Key)"; exit 1
          fi
          case "$CLOUDFLARE_ACCOUNT_ID" in *[!0-9a-f]*|"") echo "::error::CLOUDFLARE_ACCOUNT_ID should be 32 characters, 0-9 and a-f"; exit 1;; esac
          if ! curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" | grep -q '"success":true'; then
            # which accounts the token reaches (only the first 4 characters of each id: this log is public)
            IDS="$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF/accounts?per_page=50" | grep -o '"id":"[0-9a-f]\{32\}"' | cut -d'"' -f4)"
            N="$(printf '%s\n' "$IDS" | grep -c . || true)"
            SHORT="$(printf '%s\n' "$IDS" | cut -c1-4 | sed 's/$/…/' | paste -sd, -)"
            if printf '%s\n' "$IDS" | grep -qx "$CLOUDFLARE_ACCOUNT_ID"; then
              echo "::error::The token reaches the account in CLOUDFLARE_ACCOUNT_ID but has no Cloudflare Pages access there: give it Account → Cloudflare Pages → Edit for that account"
            else
              echo "::error::CLOUDFLARE_ACCOUNT_ID (starts ${CLOUDFLARE_ACCOUNT_ID:0:4}…, ${#CLOUDFLARE_ACCOUNT_ID} characters) isn't an account this token reaches. The token reaches $N account(s): ${SHORT:-none}. Use one of those ids, or make the token for that account."
            fi
            exit 1
          fi
          W="npx --yes wrangler@4.42.0"
          $W pages project list | grep -q "ggdata-report" || $W pages project create ggdata-report --production-branch main
          printf '%s' "$REPORT_PASSWORD" | $W pages secret put REPORT_PASSWORD --project-name ggdata-report
          $W pages deploy public --project-name ggdata-report --branch main --commit-dirty=true
