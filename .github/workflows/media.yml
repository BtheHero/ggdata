# Screenshots, trailers, key art and genres of every game (jobs/media.js), and every game's description in the site's
# other languages (jobs/descriptions.js), once a day after the morning Xbox run.
name: Media
on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:
concurrency:
  group: media-files   # jobs that write the same files wait for each other (the others run alongside: each uploads only what it changed)
  cancel-in-progress: false
permissions:
  contents: read
  models: read   # GitHub Models: the free machine translation of descriptions (jobs/descriptions.js)
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SRC_DIR: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download the saved files
        run: aws s3 sync s3://ggdata/data data --endpoint-url "$R2" --only-show-errors --exclude "psed/*"
      - name: Note what was downloaded
        run: node tools/upload.js snapshot
      - name: Copy files from the site
        env:
          SOURCE_API: ${{ secrets.SOURCE_API }}
        run: node seed.js
      - name: Every Xbox add-on (part of the games each day)
        run: node run.js alladdons
      - name: Look up the media
        if: always()
        run: node run.js media
      - name: Install the job's packages
        if: always()
        run: npm ci --no-audit --no-fund
      - name: Descriptions in the site's other languages
        if: always()
        env:
          # machine translation for the languages a store has no text in (jobs/descriptions.js): GitHub Models, free;
          # the Claude API instead when the ANTHROPIC_API_KEY secret is set
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node run.js desc
      - name: Upload the files
        if: always()
        run: node tools/upload.js push   # only the files this job changed
