# The Xbox store data: US export (deals, full game list, home page, price history, Game Pass), then the 10 other regions,
# then the add-ons on sale and the game pages.
# Twice a day: just after new Xbox sales start (they start at midnight UTC) and in the morning (US time).
name: Xbox
on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      pages_only:
        description: "Only rebuild the game pages (skip the store export)"
        type: boolean
        default: false
concurrency:
  group: xbox-files   # jobs that write the same files wait for each other (the others run alongside: each uploads only what it changed)
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download the saved files
        run: aws s3 sync s3://ggdata/data data --endpoint-url "$R2" --only-show-errors
      - name: Note what was downloaded
        run: node tools/upload.js snapshot
      - name: Copy files from the site
        env:
          SOURCE_API: ${{ secrets.SOURCE_API }}
        run: node seed.js
      - name: Run the export
        if: ${{ !inputs.pages_only }}
        run: node run.js xbox
      - name: Add-ons on sale and the game pages
        if: always()
        run: node run.js pages
      - name: The week's best deals
        if: always()
        run: node jobs/weekly.js xbox
      - name: Post the big new deals to social media
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_API: ${{ vars.PINTEREST_API }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SOCIAL_DRY_RUN: ${{ vars.SOCIAL_DRY_RUN }}
        run: node jobs/social.js deals xbox
      - name: Themed sale (Black Friday and the like) while it's on
        if: always()
        run: node jobs/events.js xbox
      - name: Light game list for the site's pages
        if: always()
        run: node jobs/lite.js xbox
      - name: The site's lists (best of the year, upcoming, publishers, most wanted…)
        if: always()
        run: node jobs/lists.js xbox
      - name: Upload the files
        if: always()
        run: node tools/upload.js push   # only the files this job changed
