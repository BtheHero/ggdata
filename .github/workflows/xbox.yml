# The Xbox store data: US export (deals, full game list, home page, price history, Game Pass), then the 10 other regions,
# then the add-ons on sale and the game pages.
# Twice a day: just after new Xbox sales start (they start at midnight UTC) and in the morning (US time).
name: Xbox
on:
  schedule:
    - cron: "17 0 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      pages_only:
        description: "Only rebuild the game pages (skip the store export)"
        type: boolean
        default: false
concurrency:
  group: xbox-files   # jobs that write the same files wait for each other (the others run alongside: each uploads only what it changed)
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download the saved files
        run: aws s3 sync s3://ggdata/data data --endpoint-url "$R2" --only-show-errors
      - name: Note what was downloaded
        run: node tools/upload.js snapshot
      - name: Copy files from the site
        env:
          SOURCE_API: ${{ secrets.SOURCE_API }}
        run: node seed.js
      - name: Run the export
        if: ${{ !inputs.pages_only }}
        run: node run.js xbox
      - name: Add-ons on sale and the game pages
        if: always()
        run: node run.js pages
      - name: The week's best deals
        if: always()
        run: node jobs/weekly.js xbox
      - name: Light game list for the site's pages
        if: always()
        run: node jobs/lite.js xbox
      - name: Upload the files
        if: always()
        run: node tools/upload.js push   # only the files this job changed
