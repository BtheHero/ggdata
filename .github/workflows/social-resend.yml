# Post chosen deals again, now, with their pictures (jobs/social.js "resend"): Actions → Social resend → Run workflow.
# deals: "xbox:<product id>" or "ps:<product id>", several separated by spaces (the id is in the game page's address:
# gamedealtrack.com/game/xbox/<product id>/…). networks: which ones, e.g. "instagram,pinterest" (empty: all of them).
# Today's price is used, whatever the posting rules say; it doesn't change when the deal can be posted again.
name: Social resend
on:
  workflow_dispatch:
    inputs:
      deals:
        description: 'Deals: xbox:<product id> or ps:<product id>, separated by spaces'
        required: true
      networks:
        description: 'Networks (bluesky, facebook, instagram, pinterest, x), comma-separated; empty for all'
        default: 'instagram,pinterest'
concurrency:
  group: social-queue
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download the deals and what was posted
        run: |
          for f in xbox_sales.json ps_sales.json; do aws s3 cp "s3://ggdata/data/$f" "data/$f" --endpoint-url "$R2" --only-show-errors; done
          aws s3 sync s3://ggdata/data/social data/social --endpoint-url "$R2" --only-show-errors --exclude "img/*"
      - name: Note what was downloaded
        run: node tools/upload.js snapshot
      - name: The deals' posts
        env:
          SOCIAL_RESEND: ${{ inputs.deals }}
        run: node jobs/social.js resend prepare
      - name: Their pictures (poster, price and discount, for Instagram and Pinterest)
        run: |
          npm install --no-save --no-package-lock --silent playwright-core@1.48.2
          node jobs/social-card.js deals resend
      - name: Upload the pictures (the posts link to them)
        run: node tools/upload.js push
      - name: Post them
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_API: ${{ vars.PINTEREST_API }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
          BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SOCIAL_DRY_RUN: ${{ vars.SOCIAL_DRY_RUN }}
          SOCIAL_ONLY: ${{ inputs.networks }}
        run: node jobs/social.js resend post
      - name: Upload what was posted
        if: always()
        run: node tools/upload.js push
