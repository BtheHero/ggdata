# Older prices from the Internet Archive (jobs/archive.js): a slice of the best-known games each day, until every game has
# been read; then each game again every two months for its newer saved copies.
name: Archive prices
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to run (minutes)"
        default: "100"
      debug:
        description: "Log every game's prices"
        type: boolean
        default: false
concurrency:
  group: archive-files
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      ARCHIVE_DEBUG: ${{ inputs.debug && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download the saved files
        run: |
          for f in xbox_catalog.json ps_catalog.json xbox_archive.json ps_archive.json _props.json; do
            aws s3 cp "s3://ggdata/data/$f" "data/$f" --endpoint-url "$R2" --only-show-errors || true
          done
      - name: Note what was downloaded
        run: node tools/upload.js snapshot
      - name: Read the saved store pages
        run: |
          M=${{ inputs.minutes || '100' }}
          node jobs/archive.js xbox $((M / 2))
          node jobs/archive.js ps $((M / 2))
      - name: Upload the files
        if: always()
        run: node tools/upload.js push   # only the files this job changed
