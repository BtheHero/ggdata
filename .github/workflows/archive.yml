# Older prices from the Internet Archive (jobs/archive.js): about five hours a day for each store, the best-known games
# first, until every game has been read; then each game again every two months for its newer saved copies.
name: Archive prices
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long each store runs (minutes)"
        default: "300"
      debug:
        description: "Log every game's prices"
        type: boolean
        default: false
jobs:
  run:
    strategy:
      matrix:
        store: [xbox, ps]   # side by side: each writes its own file
    concurrency:
      group: archive-${{ matrix.store }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      ARCHIVE_DEBUG: ${{ inputs.debug && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download the saved files
        run: |
          for f in ${{ matrix.store }}_catalog.json ${{ matrix.store }}_archive.json; do
            aws s3 cp "s3://ggdata/data/$f" "data/$f" --endpoint-url "$R2" --only-show-errors || true
          done
      - name: Note what was downloaded
        run: node tools/upload.js snapshot
      - name: Read the saved store pages
        run: node jobs/archive.js ${{ matrix.store }} ${{ inputs.minutes || '300' }}
      - name: Upload the files
        if: always()
        run: node tools/upload.js push   # only the files this job changed
