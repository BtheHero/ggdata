# Social media, one post at a time: the store runs and the weekly roundup queue their posts (data/social/*-queue.json),
# and this posts the next one each hour, when the last post is far enough behind (jobs/social.js "the queue").
# Settings (repository variables, optional): SOCIAL_HOURS (UTC, default 13-3), SOCIAL_MIN_GAP and SOCIAL_MAX_GAP (minutes).
name: Social queue
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
concurrency:
  group: social-queue
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download the queues and what was posted
        run: aws s3 sync s3://ggdata/data/social data/social --endpoint-url "$R2" --only-show-errors
      - name: Note what was downloaded
        run: node tools/upload.js snapshot
      - name: Post the next one
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_API: ${{ vars.PINTEREST_API }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
          BUFFER_PINTEREST_CHANNEL_ID: ${{ secrets.BUFFER_PINTEREST_CHANNEL_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SOCIAL_DRY_RUN: ${{ vars.SOCIAL_DRY_RUN }}
          SOCIAL_HOURS: ${{ vars.SOCIAL_HOURS }}
          SOCIAL_MIN_GAP: ${{ vars.SOCIAL_MIN_GAP }}
          SOCIAL_MAX_GAP: ${{ vars.SOCIAL_MAX_GAP }}
        run: node jobs/social.js next
      - name: Upload what was posted
        if: always()
        run: node tools/upload.js push
